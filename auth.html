<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Agents Desk</title>
<meta name="description" content="Create your Agents Desk account or log in to your desk.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0E">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="site.css?v=20261013">
<link rel="stylesheet" href="auth.css?v=20261013">
</head>
<body class="auth-page">
<a class="auth-back" href="index.html">← Back to the website</a>
<main class="auth-wrap" id="main">
  <form class="form" id="authForm" novalidate>
    <a class="auth-brand" href="index.html" aria-label="Agents Desk home"><svg width="30" height="30" viewBox="0 0 44 44" fill="none" aria-hidden="true"><circle cx="22" cy="22" r="13.5" stroke="#F4691F" stroke-width="2"/><circle cx="22" cy="22" r="9" stroke="currentColor" stroke-width="3"/><circle cx="22" cy="22" r="4.4" fill="#F4691F"/></svg><span>Agents Desk</span></a>
    <h1 id="aTitle">Create your account</h1>
    <p class="auth-sub" id="aSub">Start with a 3-day free trial.</p>
    <p class="auth-note" id="notice" role="status" hidden></p>

    <div class="flex-column" data-only="signup"><label for="fName">Full name</label></div>
    <div class="inputForm" data-only="signup">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
      <input id="fName" name="name" class="input" autocomplete="name" placeholder="Enter your name">
    </div>

    <div class="flex-column"><label for="fEmail">Email</label></div>
    <div class="inputForm">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>
      <input id="fEmail" name="email" type="email" class="input" autocomplete="email" placeholder="Enter your email">
    </div>

    <div class="flex-column"><label for="fPw">Password</label></div>
    <div class="inputForm">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <input id="fPw" name="password" type="password" class="input" autocomplete="new-password" placeholder="Enter your password">
      <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>

    <div class="flex-row" data-only="login">
      <div><input type="checkbox" id="fKeep" checked><label for="fKeep">Remember me</label></div>
      <button type="button" class="span" id="forgot">Forgot password?</button>
    </div>

    <button class="button-submit" id="aGo" type="submit">Sign up</button>
    <p class="p" id="switchLine"></p>
    <p class="p line">Or with</p>

    <div class="flex-row">
      <button type="button" class="btn google" data-sso="Google"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.39 3.62v3h3.87c2.26-2.09 3.57-5.16 3.57-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.91l-3.87-3c-1.07.72-2.45 1.15-4.06 1.15-3.12 0-5.77-2.11-6.71-4.95H1.29v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.29 14.29a7.2 7.2 0 0 1 0-4.58v-3.1H1.29a12 12 0 0 0 0 10.78l4-3.1z"/><path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.59 1.8l3.43-3.43A11.5 11.5 0 0 0 12 0 12 12 0 0 0 1.29 6.61l4 3.1C6.23 6.86 8.88 4.75 12 4.75z"/></svg>Google</button>
      <button type="button" class="btn apple" data-sso="Apple"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.03-2.73 2.23-4.05 2.33-4.11-1.27-1.86-3.25-2.11-3.95-2.14-1.68-.17-3.28.99-4.13.99-.86 0-2.17-.97-3.57-.94-1.84.03-3.53 1.07-4.48 2.71-1.91 3.31-.49 8.22 1.37 10.91.91 1.31 2 2.79 3.42 2.74 1.37-.05 1.89-.89 3.55-.89 1.65 0 2.12.89 3.57.86 1.48-.03 2.41-1.34 3.31-2.66 1.04-1.52 1.47-3 1.5-3.07-.03-.02-2.88-1.11-2.92-4.4zM13.65 4.58c.75-.92 1.26-2.19 1.12-3.46-1.08.04-2.4.72-3.18 1.63-.69.8-1.31 2.1-1.14 3.34 1.21.09 2.44-.61 3.2-1.51z"/></svg>Apple</button>
    </div>

    <p class="fine" data-only="signup">By signing up you agree to our <a href="https://agentsdesk.football/term-of-service" target="_blank" rel="noopener">Terms</a> and <a href="https://agentsdesk.football/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a>.</p>
  </form>
</main>
<script src="billing.js?v=20261013"></script>
<script src="auth.js?v=20261013"></script>
</body>
</html>
