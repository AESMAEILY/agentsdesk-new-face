<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard demo · Agents Desk</title>
<meta name="description" content="Interactive demo of the Agents Desk dashboard: AI player search, No Agents list, deal and commission calculator, agency overview and live transfer feeds. Sample data only.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0E">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="ad-loading" id="adLoad" role="status" aria-live="polite">
  <div class="adl">
    <div class="adl-mark" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><circle class="adl-trk" cx="32" cy="32" r="29"/><circle class="adl-arc" cx="32" cy="32" r="29"/><circle cx="32" cy="32" r="12.5" stroke="#F3F2F0" stroke-width="3.6"/><circle class="adl-dot" cx="32" cy="32" r="6" fill="#F4691F"/></svg></div>
    <div class="adl-word"><b>Agents Desk</b><span id="adLoadCap">Loading</span></div>
    <div class="adl-bar" aria-hidden="true"><i id="adLoadBar"></i></div>
  </div>
</div>
<div id="app" data-lenis-prevent aria-hidden="true">
  <aside class="sb" id="sb" aria-label="Dashboard menu"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="mn" id="mn">
    <header class="tb">
      <button class="burger" id="burger" aria-label="Open menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <label class="tb-s"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="gsearch" placeholder="Search players, clubs, deals, news…" aria-label="Search"></label>
      <span class="sp"></span>
      <span class="demo-pill" title="Everything in this dashboard is sample data"><i></i>Demo<span>&nbsp;· sample data</span></span>
      <a class="btn b-gh b-sm back-site" href="index.html" id="backSite">← Back to site</a>
      <span class="me"><span class="av">AG</span><div><b>Your desk</b><span>Agent</span></div></span>
    </header>
    <div id="view"></div>
  </div>
  <div class="modal" id="modal"><div class="bg" data-close></div><div class="pn"><button class="x" data-close aria-label="Close">×</button><div id="modalBody"></div></div></div>
  <div class="toast" id="toast" role="status"></div>
</div>


<script src="orb.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
